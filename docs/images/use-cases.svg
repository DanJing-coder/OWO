<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Three OWO v0.1 example workflows</title>
  <desc id="desc">Server maintenance waits for an observed health check. A support ticket closes after notification is recorded. An inventory item can be reserved for an approved order. All three are symbolic JSON state transitions.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="44" y="60" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">The same protocol across three domains</text>
  <text x="44" y="94" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18">Each example is a complete JSON world with facts, an action, and a testable result.</text>

  <rect x="42" y="129" width="350" height="350" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="42" y="129" width="350" height="8" rx="4" fill="#2563eb"/>
  <text x="62" y="181" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Server maintenance</text>
  <text x="62" y="218" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16">running + approved</text>
  <path d="M 76 234 L 76 266" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M 76 271 L 69 260 L 83 260 Z" fill="#2563eb"/>
  <rect x="62" y="281" width="310" height="52" rx="10" fill="#eff6ff"/>
  <text x="78" y="314" fill="#0f172a" font-family="monospace" font-size="17">begin_restart → true</text>
  <text x="62" y="365" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16">status becomes restarting</text>
  <text x="62" y="400" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Completion waits for health check</text>
  <text x="62" y="438" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="15">Missing observation → unknown</text>

  <rect x="425" y="129" width="350" height="350" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="425" y="129" width="350" height="8" rx="4" fill="#7c3aed"/>
  <text x="445" y="181" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Support ticket</text>
  <text x="445" y="218" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16">resolved + not yet notified</text>
  <path d="M 459 234 L 459 266" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <path d="M 459 271 L 452 260 L 466 260 Z" fill="#7c3aed"/>
  <rect x="445" y="281" width="310" height="52" rx="10" fill="#f5f3ff"/>
  <text x="461" y="314" fill="#0f172a" font-family="monospace" font-size="16">record_notification</text>
  <text x="445" y="365" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16">customer_notified = true</text>
  <text x="445" y="400" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">close_ticket → true</text>
  <text x="445" y="438" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="15">No message is sent by OWO</text>

  <rect x="808" y="129" width="350" height="350" rx="18" fill="#fff" stroke="#5eead4" stroke-width="2"/>
  <rect x="808" y="129" width="350" height="8" rx="4" fill="#0d9488"/>
  <text x="828" y="181" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Inventory item</text>
  <text x="828" y="218" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16">available + order approved</text>
  <path d="M 842 234 L 842 266" fill="none" stroke="#0d9488" stroke-width="3"/>
  <path d="M 842 271 L 835 260 L 849 260 Z" fill="#0d9488"/>
  <rect x="828" y="281" width="310" height="52" rx="10" fill="#f0fdfa"/>
  <text x="844" y="314" fill="#0f172a" font-family="monospace" font-size="17">reserve_item → true</text>
  <text x="828" y="365" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16">reserved_for = order_17</text>
  <text x="828" y="400" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Second reserve → false</text>
  <text x="828" y="438" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="15">Real stock needs a transaction</text>

  <rect x="42" y="503" width="1116" height="39" rx="10" fill="#e2e8f0"/>
  <text x="60" y="529" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">OWO evaluates and predicts JSON state; external executors perform and verify real-world operations.</text>
</svg>
